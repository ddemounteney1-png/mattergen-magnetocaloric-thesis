name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only the small loss-curve CSVs are needed; skipping the rest keeps
      # Git LFS bandwidth low.
      - name: Fetch loss curves from Git LFS
        run: git lfs pull --include="results/loss_curves/*.csv"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest
